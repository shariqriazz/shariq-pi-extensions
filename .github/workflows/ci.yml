name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: mise exec --locked -- bun install --frozen-lockfile
      - run: mise exec --locked -- bun run validate
      - run: mise exec --locked -- bun run pack:inspect
