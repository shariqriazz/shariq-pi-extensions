name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: npm ci
      - run: npm run validate
      - run: npm run validate --workspace @shariqriaz/pi-memory
      - run: npm pack --dry-run
      - run: npm pack --dry-run --workspace @shariqriaz/pi-memory
