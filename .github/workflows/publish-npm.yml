name: Publish private npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - suite
          - memory

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: npm ci
      - run: printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$HOME/.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm run validate
      - run: npm run validate --workspace @shariqriazz/pi-memory
      - name: Publish suite
        if: inputs.package == 'suite'
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish memory
        if: inputs.package == 'memory'
        run: npm publish --access restricted --workspace @shariqriazz/pi-memory
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
