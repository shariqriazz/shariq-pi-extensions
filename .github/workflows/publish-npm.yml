name: Publish npm package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - run: mise exec --locked -- bun install --frozen-lockfile
      - run: mise exec --locked -- bun run validate
      - name: Publish if version updated
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view shariq-pi-extensions version 2>/dev/null || echo "0.0.0")
          if [ "$CURRENT_VERSION" != "$NPM_VERSION" ]; then
            echo "Publishing version $CURRENT_VERSION (npm registry has $NPM_VERSION)..."
            mise exec --locked -- npm publish --access public --provenance
          else
            echo "Version $CURRENT_VERSION is already published on npm. Skipping publish step."
          fi
